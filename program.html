  <title>项目详解｜GradPath</title>
  <style>
    :root{--ink:#18201e;--muted:#69736e;--paper:#f6f4ee;--card:#fffdf8;--green:#174c3c;--lime:#dff36d;--line:#dcded5;--orange:#c75d35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 24px}header{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:900;color:var(--ink);text-decoration:none}.brand i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--lime);margin-right:8px}.back{color:var(--green);font-size:13px;font-weight:800;text-decoration:none}.hero{padding:48px 0 28px}.school{font-size:12px;color:var(--green);font-weight:900;text-transform:uppercase;letter-spacing:.7px}.hero h1{font-size:42px;line-height:1.12;letter-spacing:-1.7px;max-width:850px;margin:10px 0 14px}.sub{font-size:16px;color:var(--muted)}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.tag,.status{font-size:11px;border-radius:20px;padding:6px 9px;background:#e9ede5}.status{background:#e7f1df;color:var(--green);font-weight:800}.status.wait{background:#fff0dc;color:#82511e}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;padding-bottom:70px}.main{display:flex;flex-direction:column;gap:17px}.panel,.side{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}.panel h2{font-size:21px;margin:0 0 13px}.panel h3{font-size:15px;margin:18px 0 8px}.panel p{font-size:14px;line-height:1.75;color:#505b56}.lead{font-size:16px!important;color:var(--ink)!important}.topic-grid,.material-grid,.source-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.topic{border:1px solid var(--line);border-radius:12px;padding:13px}.topic b{font-size:13px}.topic p{font-size:12px;margin:6px 0 0}.timeline{border-left:2px solid var(--line);margin-left:4px;padding-left:18px}.event{position:relative;margin:0 0 20px}.event:before{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:var(--lime);border:2px solid var(--green);left:-24px;top:4px}.event b{font-size:13px}.event p{font-size:12px;margin:4px 0}.material-col{border:1px solid var(--line);border-radius:13px;padding:14px}.material-col h3{margin:0 0 10px}.mat{display:flex;gap:8px;font-size:12px;line-height:1.5;margin:8px 0}.mat:before{content:'✓';width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:#e8f1df;color:var(--green);display:grid;place-items:center;font-weight:900}.mat.optional:before{content:'○';background:#fff0dc;color:#8a541f}.mat.evidence:before{content:'◇';background:#e9ecf3;color:#425a76}.notice{background:#f1f3ec;border-radius:12px;padding:13px;font-size:12px;line-height:1.6;color:var(--muted)}.sidecol{display:flex;flex-direction:column;gap:14px}.side{position:sticky;top:14px}.deadline{font-size:21px;font-weight:900;line-height:1.35;margin:8px 0}.official-links{display:grid;gap:8px;margin:14px 0}.official{display:block;text-align:center;background:var(--lime);color:#26321f;text-decoration:none;border-radius:12px;padding:13px;font-size:13px;font-weight:900}.official.secondary{background:white;border:1px solid var(--green);color:var(--green)}.bar-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.bar-header .status{white-space:nowrap}.weight-chart{display:grid;gap:11px;margin:16px 0}.weight-row{display:grid;grid-template-columns:165px 1fr 42px;gap:10px;align-items:center;font-size:12px}.weight-track{height:10px;background:#e6e8e2;border-radius:10px;overflow:hidden}.weight-track i{display:block;height:100%;border-radius:10px;background:var(--green)}.match-chart .weight-track i{background:var(--lime);box-shadow:inset 0 0 0 1px #b8c94d}.match-summary{display:flex;align-items:center;gap:16px;background:var(--green);color:white;border-radius:14px;padding:16px;margin:18px 0}.match-summary b{font-size:34px}.match-summary span{font-size:12px;opacity:.8}.save{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.check{display:flex;gap:8px;margin:9px 0;font-size:12px;line-height:1.45}.check input{accent-color:var(--green);margin-top:2px}.source{border-top:1px solid var(--line);padding:12px 0}.source:first-child{border:0;padding-top:0}.source a{font-size:13px;color:var(--green);font-weight:800;text-decoration:none}.source small{display:block;color:var(--muted);margin-top:4px}.advice{border-left:4px solid var(--green);background:#f3f7ee;border-radius:10px;padding:14px;margin:10px 0}.advice li{font-size:12px;line-height:1.6;margin:5px 0}.case{border:1px solid var(--line);border-radius:13px;padding:14px}.case p{font-size:12px;margin:5px 0}.trust{display:inline-block;font-size:10px;font-weight:900;padding:3px 7px;border-radius:20px;background:#e7f1df}.trust.low{background:#fff0dc;color:#82511e}.empty{padding:70px 0;text-align:center}footer{border-top:1px solid var(--line);padding:25px 0 40px;color:var(--muted);font-size:12px}@media(max-width:850px){.hero h1{font-size:34px}.layout{grid-template-columns:1fr}.side{position:static}.topic-grid,.material-grid,.source-grid{grid-template-columns:1fr}.weight-row{grid-template-columns:120px 1fr 38px}}
  .mat{margin:10px 0;align-items:flex-start}.mat b{display:block}.mat small{display:block;color:var(--muted);margin-top:3px}
  .requirement-panel{border-color:#b9c9b9;background:linear-gradient(180deg,#fffef9,#fbfcf5)}.section-title{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.section-title h2{margin-bottom:5px}.section-title p{font-size:12px;margin:0}.checked{white-space:nowrap;font-size:10px;font-weight:800;color:var(--green);background:#e8f1df;border-radius:20px;padding:6px 9px}.req-legend{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.req-badge{display:inline-block;border-radius:20px;padding:4px 7px;font-size:9px;font-weight:900;background:#edf0e8;color:#59625e}.req-badge.hard{background:#174c3c;color:white}.req-badge.info{background:#e7f1df;color:#174c3c}.req-badge.plan{background:#fff0dc;color:#82511e}.req-badge.third{background:#e9ecf3;color:#425a76}.req-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.req-card,.req-doc{border:1px solid var(--line);background:white;border-radius:13px;padding:14px}.req-card h3{font-size:12px;margin:0}.req-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.req-main{display:block;margin-top:11px;font-size:14px}.req-card p,.req-doc p{font-size:12px;margin:6px 0 0}.req-docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.req-doc small{display:block;color:var(--green);font-weight:700;margin-top:8px;line-height:1.5}.accuracy-note{margin-top:14px;border-left:4px solid var(--orange);background:#fff8ed;border-radius:10px;padding:12px;font-size:11px;line-height:1.65;color:#695347}@media(max-width:850px){.req-grid,.req-docs{grid-template-columns:1fr}.section-title{display:block}.checked{display:inline-block;margin-top:8px}}
