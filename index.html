  <title>GradPath · 申研规划平台</title>
  <style>
    :root{--ink:#18201e;--muted:#6e7772;--paper:#f6f4ee;--card:#fffdf8;--green:#174c3c;--lime:#dff36d;--line:#dcded5;--orange:#db6b3a}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 24px}header{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900;font-size:22px;letter-spacing:-.5px}.brand i{display:inline-block;width:13px;height:13px;background:var(--lime);border-radius:50%;margin-right:8px}.nav{color:var(--muted);font-size:14px}.hero{padding:64px 0 36px;display:grid;grid-template-columns:1.35fr .65fr;gap:44px;align-items:end}.eyebrow{font-size:13px;font-weight:800;color:var(--green);letter-spacing:1.5px}.hero h1{font-size:58px;line-height:1.04;letter-spacing:-2.7px;margin:13px 0 20px}.hero p{color:var(--muted);font-size:17px;line-height:1.8;max-width:650px}.stamp{background:var(--green);color:white;border-radius:24px;padding:28px;transform:rotate(1.5deg)}.stamp b{font-size:40px;display:block}.stamp span{opacity:.75;line-height:1.6}.search{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:1fr 1fr 180px;gap:12px;box-shadow:0 15px 50px #25433612}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px 5px}.field input,.field select{width:100%;height:52px;border:1px solid var(--line);border-radius:13px;background:white;padding:0 15px;font-size:15px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--green)}button{border:0;border-radius:13px;font-weight:800;cursor:pointer}.primary{height:52px;background:var(--lime);color:#21301e;margin-top:21px;font-size:15px}.primary:hover{filter:brightness(.96)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:34px 0 18px}.toolbar h2{font-size:25px;margin:0}.count{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:70px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #1d3d3012}.top{display:flex;justify-content:space-between;gap:12px}.school{font-size:12px;font-weight:800;color:var(--green);text-transform:uppercase}.save{background:transparent;font-size:20px;color:#a9ada7;padding:0}.save.on{color:var(--orange)}.card h3{font-size:20px;line-height:1.35;margin:11px 0 8px}.meta{font-size:13px;color:var(--muted);min-height:38px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.tag{font-size:11px;padding:6px 9px;background:#edf0e8;border-radius:20px}.deadline{border-top:1px solid var(--line);padding-top:15px;display:flex;justify-content:space-between;align-items:center}.deadline small{display:block;color:var(--muted);margin-bottom:4px}.deadline strong{font-size:15px}.detail{color:var(--green);background:transparent;padding:8px;font-weight:800}.empty{grid-column:1/-1;background:var(--card);border:1px dashed #aeb6ac;border-radius:18px;text-align:center;padding:55px 20px;color:var(--muted)}dialog{width:min(760px,calc(100% - 30px));border:0;border-radius:22px;padding:0;background:var(--card);box-shadow:0 30px 100px #0005}dialog::backdrop{background:#15231e99;backdrop-filter:blur(3px)}.modal{padding:28px}.modal-head{display:flex;justify-content:space-between;gap:20px}.modal h2{margin:5px 0}.close{background:#eceee8;width:38px;height:38px;font-size:20px}.sections{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:24px}.section h4{margin:0 0 12px}.timeline{border-left:2px solid var(--line);padding-left:17px}.event{margin-bottom:17px}.event b{font-size:13px}.event p{font-size:12px;color:var(--muted);margin:4px 0}.check{display:flex;gap:9px;margin:10px 0;font-size:13px;align-items:start}.check input{accent-color:var(--green)}.source{margin-top:18px;background:#eff1e9;border-radius:13px;padding:13px;font-size:12px;color:var(--muted)}.source a{color:var(--green);font-weight:800}.notice{margin-top:16px;color:#856030;font-size:12px}.filters{display:flex;gap:10px}.filter{padding:9px 13px;background:transparent;border:1px solid var(--line);color:var(--muted)}.filter.active{background:var(--green);color:white;border-color:var(--green)}footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:12px}@media(max-width:850px){.hero{grid-template-columns:1fr}.stamp{display:none}.hero h1{font-size:42px}.search{grid-template-columns:1fr}.primary{margin-top:0}.grid{grid-template-columns:1fr}.sections{grid-template-columns:1fr}.toolbar{align-items:flex-end}.filters{flex-wrap:wrap;justify-content:flex-end}}
  </style>
  <style>
    .autocomplete{position:relative}.suggestions{display:none;position:absolute;z-index:40;top:calc(100% + 8px);left:0;right:0;background:#fffdf8;border:1px solid var(--line);border-radius:15px;padding:8px;box-shadow:0 18px 46px rgba(24,32,30,.16);max-height:330px;overflow:auto}.suggestions.open{display:block}.suggestion-heading{padding:7px 9px 5px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.6px}.suggestion-item{display:block;width:100%;border:0;background:transparent;border-radius:10px;padding:10px 11px;text-align:left;color:var(--ink)}.suggestion-item:hover,.suggestion-item:focus-visible{background:#edf0e8;outline:none}.suggestion-item strong{display:block;font-size:13px;line-height:1.35}.suggestion-item small{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.4}.school-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.school-tag{border:1px solid var(--line);background:#edf0e8;color:#44504a;border-radius:20px;padding:7px 11px;font-size:12px;transition:.15s}.school-tag:hover,.school-tag:focus-visible{border-color:var(--green);color:var(--green);outline:none}.school-tag.active{background:var(--green);border-color:var(--green);color:white}.school-tags-label{display:flex;align-items:center;color:var(--muted);font-size:11px;font-weight:800;margin-right:2px}
    @media(max-width:850px){.suggestions{position:static;margin-top:8px;max-height:260px}.school-tags-label{width:100%}}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand"><i></i>GradPath</div><div style="display:flex;align-items:center;gap:16px"><div class="nav">项目发现　·　申请规划　·　材料追踪</div><button class="filter active" id="assessBtn">个人能力评估</button></div></header>
    <section class="hero"><div><div class="eyebrow">OFFICIAL SOURCES · UPDATED 2026-08-15</div><h1>把复杂的申研，<br>变成清晰的下一步。</h1><p>从学校官网发现项目，统一整理截止日期、申请材料和准备节奏。每条信息都保留来源；尚未发布的新周期日期会明确标为待公布。</p></div><aside class="stamp"><b>3 步</b><span>找到项目<br>核对要求<br>生成行动计划</span></aside></section>
    <section class="search">
      <div class="field autocomplete"><label for="school">学校</label><input id="school" placeholder="如 MIT、剑桥、香港大学" autocomplete="off" aria-autocomplete="list" aria-expanded="false" aria-controls="schoolSuggestions" /><div class="suggestions" id="schoolSuggestions" role="listbox"></div></div>
      <div class="field autocomplete"><label for="major">项目 / 方向</label><input id="major" placeholder="如金融工程、资产管理、FinTech" autocomplete="off" aria-autocomplete="list" aria-expanded="false" aria-controls="majorSuggestions" /><div class="suggestions" id="majorSuggestions" role="listbox"></div></div>
      <button class="primary" id="searchBtn">检索项目 →</button>
    </section>
    <div class="school-tags" id="schoolTags" aria-label="按目标院校查看全部项目">
      <span class="school-tags-label">热门院校 · 点击查看全部项目</span><button class="school-tag" data-school="MIT">MIT</button><button class="school-tag" data-school="耶鲁">耶鲁</button><button class="school-tag" data-school="普林斯顿">普林斯顿</button><button class="school-tag" data-school="哈佛">哈佛</button><button class="school-tag" data-school="斯坦福">斯坦福</button><button class="school-tag" data-school="牛津">牛津</button><button class="school-tag" data-school="剑桥">剑桥</button><button class="school-tag" data-school="LBS">LBS</button><button class="school-tag" data-school="港大">港大</button>
    </div>
    <div class="toolbar"><div><h2 id="resultTitle">精选项目</h2><div class="count" id="count"></div></div><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="china">清北推免</button><button class="filter" data-filter="recommended">推荐新增</button><button class="filter" data-filter="dual">双学位</button><button class="filter" data-filter="saved">已收藏</button></div></div>
    <main class="grid" id="grid"></main>
    <footer>GradPath · 申请信息核验于 2026-08-15；正式提交前请再次打开项目官网确认。</footer>
  </div>
  <dialog id="dialog"><div class="modal" id="modal"></div></dialog>
  <dialog id="assessDialog" class="assess-dialog"><div class="modal" id="assessModal"></div></dialog>
  <script src="data.js"></script>
  <script src="official-links.js?v=20260815-2"></script>
  <script>
  const programs=window.GRADPATH_PROGRAMS||[
    {id:1,school:'Massachusetts Institute of Technology',aliases:'MIT 麻省理工',name:'Master of Science in Electrical Engineering and Computer Science',degree:'SM · 校内研究型项目',field:'Computer Science AI EECS 计算机 人工智能',deadline:'以官网当期通知为准',term:'Fall intake',tags:['研究导向','全日制','STEM'],url:'https://www.eecs.mit.edu/academics/graduate-programs/admission-process/',materials:['在线申请表','成绩单','3 封推荐信','Statement of Objectives','英语能力证明（如适用）'],events:[['入学前 12–15 个月','确认研究方向与项目适配度'],['9–10 月','准备文书、推荐信与成绩单'],['官网截止日前','提交并复核申请'],['提交后','跟踪状态及补件通知']]},
    {id:2,school:'Stanford University',aliases:'Stanford 斯坦福',name:'MS in Computer Science',degree:'Master of Science · 45 units',field:'Computer Science AI HCI Systems 计算机 人工智能',deadline:'以官网当期通知为准',term:'Autumn intake',tags:['课程灵活','STEM','多方向'],url:'https://www.cs.stanford.edu/admissions/graduate-admissions',materials:['在线申请表','个人陈述','3 封推荐信','成绩单','英语能力证明（如适用）'],events:[['8–9 月','核对当年招生页面与细分方向'],['9–11 月','完成 SOP 与推荐信沟通'],['官网截止日前','提交申请与成绩信息'],['次年春季','关注录取及资助信息']]},
    {id:3,school:'University of Cambridge',aliases:'Cambridge 剑桥',name:'MPhil in Advanced Computer Science',degree:'MPhil · 9 months',field:'Computer Science AI Data 计算机 数据科学',deadline:'以课程目录当期日期为准',term:'Michaelmas term',tags:['9 个月','研究项目','英国'],url:'https://www.postgraduate.study.cam.ac.uk/courses/directory/cscsmpacs',materials:['在线申请','成绩单','2 封推荐信','Statement of Interest','简历','英语能力证明'],events:[['提前 12 个月','检查课程页开放状态与资助截止日'],['9–11 月','准备研究兴趣陈述及推荐信'],['资助截止日前','如需奖学金，优先提交'],['课程截止日前','完成最终提交']]},
    {id:4,school:'The University of Hong Kong',aliases:'HKU 港大 香港大学',name:'Master of Science in Computer Science',degree:'MSc · Full-time / Part-time',field:'Computer Science FinTech AI 计算机 金融科技',deadline:'多轮申请，以官网为准',term:'September intake',tags:['多方向','香港','授课型'],url:'https://www.msc-cs.hku.hk/AdmissionRequirements',materials:['在线申请','学位及成绩证明','英语能力证明','个人陈述/补充材料','推荐材料（按当年要求）'],events:[['开放申请前','确认方向及语言成绩要求'],['第一轮前 6–8 周','准备证明文件和文书'],['建议首轮提交','热门项目尽早申请'],['提交后','关注面试或补件通知']]},
    {id:5,school:'University of Oxford',aliases:'Oxford 牛津',name:'MSc in Financial Economics',degree:'MSc · 9 months',field:'Finance Economics 金融 经济 商科',deadline:'分轮次，以官网为准',term:'September intake',tags:['金融','商学院','英国'],url:'https://www.sbs.ox.ac.uk/oxford-experience/coming-oxford/msc-financial-economics',materials:['在线申请','成绩单','GMAT/GRE（以当年要求为准）','Essay / Supporting statement','推荐信','英语能力证明'],events:[['提前 12–15 个月','准备标化并评估背景'],['开放申请后','选择轮次并倒排材料'],['目标轮次前 4 周','完成文书和推荐信'],['提交后','准备潜在面试']]},
    {id:6,school:'Carnegie Mellon University',aliases:'CMU 卡内基梅隆',name:'Master of Computational Data Science',degree:'MCDS · Professional master',field:'Data Science Computer Science AI 数据科学 计算机',deadline:'以官网当期通知为准',term:'Fall intake',tags:['数据科学','工程实践','STEM'],url:'https://www.lti.cs.cmu.edu/academics/masters-programs/mcds.html',materials:['在线申请','成绩单','推荐信','Statement of Purpose','简历','英语能力证明'],events:[['8–9 月','确认项目先修课和申请要求'],['9–11 月','准备 SOP、简历和推荐信'],['官网截止日前','完成申请并保存回执'],['提交后','检查状态页和邮件']]}
  ];
  let saved=new Set(JSON.parse(localStorage.getItem('gradpath-saved')||'[]')), current=[...programs], filter='all';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function officialLinkHtml(p){const links=window.GRADPATH_GET_OFFICIAL_LINKS?window.GRADPATH_GET_OFFICIAL_LINKS(p):{program:p.url,apply:p.url,same:true};return links.same?`<a href="${esc(links.program)}" target="_blank" rel="noopener">项目官网与申请入口 ↗</a>`:`<a href="${esc(links.program)}" target="_blank" rel="noopener">官网项目介绍 ↗</a>　<a href="${esc(links.apply)}" target="_blank" rel="noopener">官网申请入口 ↗</a>`}
  const schoolInput=document.querySelector('#school'),majorInput=document.querySelector('#major');
  const featuredSchools=[['MIT','MIT'],['耶鲁','耶鲁'],['普林斯顿','普林斯顿'],['哈佛','哈佛'],['斯坦福','斯坦福'],['牛津','牛津'],['剑桥','剑桥'],['LBS','LBS'],['港大','港大']];
  const popularDirections=[['金融','核心金融与投资'],['金融工程','数理与衍生品方向'],['量化','量化金融、交易与建模'],['资产管理','投资、财富与资产配置'],['金融科技','FinTech、数据与机器学习']];
  const schoolOptions=[...new Map(programs.map(p=>[p.school,{title:p.school,value:p.school,subtitle:p.aliases||'院校项目'}])).values()];
  const matchesSchool=(p,q)=>`${p.school} ${p.aliases||''}`.toLowerCase().includes(String(q).toLowerCase());
  function setFilterAll(){filter='all';document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'))}
  function closeSuggestions(except){document.querySelectorAll('.suggestions').forEach(panel=>{if(panel!==except)panel.classList.remove('open')});document.querySelectorAll('[aria-controls$="Suggestions"]').forEach(input=>{if(!except||input.getAttribute('aria-controls')!==except.id)input.setAttribute('aria-expanded','false')})}
  function suggestionHTML(items,heading){return `<div class="suggestion-heading">${esc(heading)}</div>${items.map((item,i)=>`<button type="button" class="suggestion-item" role="option" data-suggestion="${i}"><strong>${esc(item.title)}</strong><small>${esc(item.subtitle)}</small></button>`).join('')}`}
  function showSchoolSuggestions(){const q=schoolInput.value.trim().toLowerCase();let items;if(q){items=schoolOptions.filter(x=>`${x.title} ${x.subtitle}`.toLowerCase().includes(q)).slice(0,8).map(x=>({...x,subtitle:`${x.subtitle} · ${programs.filter(p=>p.school===x.value).length} 个项目`}))}else{items=featuredSchools.map(([title,value])=>({title,value,subtitle:`${programs.filter(p=>matchesSchool(p,value)).length} 个相关项目`}))}const panel=document.querySelector('#schoolSuggestions');panel._items=items;panel.innerHTML=suggestionHTML(items,q?'匹配院校':'常见目标院校');panel.classList.add('open');schoolInput.setAttribute('aria-expanded','true');closeSuggestions(panel)}
  function showMajorSuggestions(){const q=majorInput.value.trim().toLowerCase();let items;if(q){items=programs.filter(p=>`${p.name} ${p.field||''} ${(p.tags||[]).join(' ')}`.toLowerCase().includes(q)).slice(0,8).map(p=>({title:p.name,value:p.name,school:p.school,subtitle:p.school}))}else{items=popularDirections.map(([title,subtitle])=>({title,value:title,subtitle:`热门方向 · ${subtitle}`}))}const panel=document.querySelector('#majorSuggestions');panel._items=items;panel.innerHTML=suggestionHTML(items,q?'匹配项目':'热门项目方向');panel.classList.add('open');majorInput.setAttribute('aria-expanded','true');closeSuggestions(panel)}
  function render(){let list=filter==='saved'?current.filter(p=>saved.has(p.id)):filter==='dual'?current.filter(p=>p.isDual):filter==='recommended'?current.filter(p=>p.isRecommended):filter==='china'?current.filter(p=>p.isChinaRecommend):current;document.querySelector('#count').textContent=`找到 ${list.length} 个项目 · 信息需以官网实时核验`;document.querySelector('#grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="top"><div class="school">${p.school}</div><button class="save ${saved.has(p.id)?'on':''}" data-save="${p.id}" aria-label="收藏">${saved.has(p.id)?'♥':'♡'}</button></div><h3>${p.name}</h3><div class="meta">${p.degree} · ${p.term}</div><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="deadline"><div><small>申请截止</small><strong>${p.deadline}</strong></div><div class="card-actions"><button class="summary" data-id="${p.id}">项目简介</button><button class="detail" data-detail="${p.id}">项目详解 →</button></div></div></article>`).join(''):`<div class="empty"><b>没有找到匹配项目</b><p>请更换学校或方向关键词。</p></div>`}
  function search(options={}){const s=schoolInput.value.trim().toLowerCase(),m=majorInput.value.trim().toLowerCase();current=programs.filter(p=>(!s||matchesSchool(p,s))&&(!m||`${p.name} ${p.field||''} ${(p.tags||[]).join(' ')}`.toLowerCase().includes(m)));document.querySelector('#resultTitle').textContent=options.title||(s||m?'检索结果':'精选项目');if(!options.keepTag)document.querySelectorAll('.school-tag').forEach(x=>x.classList.remove('active'));closeSuggestions();render()}
  function openDetail(p){document.querySelector('#modal').innerHTML=`<div class="modal-head"><div><div class="school">${p.school}</div><h2>${p.name}</h2><div class="meta">${p.degree} · ${p.term}</div></div><button class="close" id="close">×</button></div><div class="sections"><section class="section"><h4>建议申请时间线</h4><div class="timeline">${p.events.map(e=>`<div class="event"><b>${e[0]}</b><p>${e[1]}</p></div>`).join('')}</div></section><section class="section"><h4>材料准备清单</h4>${p.materials.map((x,i)=>`<label class="check"><input type="checkbox" data-check="${p.id}-${i}" ${localStorage.getItem('check-'+p.id+'-'+i)==='1'?'checked':''}><span>${x}</span></label>`).join('')}</section></div><div class="source">官网来源：${officialLinkHtml(p)}</div><div class="notice">申请资料核验于 ${window.GRADPATH_DATA_DATE||'2026-08-15'}。官网尚未公布的新周期日期会保留“待公布”，不会用往年日期替代；正式提交前请再次核对官方页面。</div>`;document.querySelector('#dialog').showModal();document.querySelector('#close').onclick=()=>document.querySelector('#dialog').close();document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>localStorage.setItem('check-'+x.dataset.check,x.checked?'1':'0'))}
  schoolInput.addEventListener('focus',showSchoolSuggestions);schoolInput.addEventListener('input',showSchoolSuggestions);majorInput.addEventListener('focus',showMajorSuggestions);majorInput.addEventListener('input',showMajorSuggestions);
  document.querySelector('#schoolSuggestions').addEventListener('click',e=>{const b=e.target.closest('[data-suggestion]');if(!b)return;const item=e.currentTarget._items[+b.dataset.suggestion];schoolInput.value=item.value;setFilterAll();search()});
  document.querySelector('#majorSuggestions').addEventListener('click',e=>{const b=e.target.closest('[data-suggestion]');if(!b)return;const item=e.currentTarget._items[+b.dataset.suggestion];majorInput.value=item.value;if(item.school)schoolInput.value=item.school;setFilterAll();search()});
  document.querySelector('#schoolTags').addEventListener('click',e=>{const b=e.target.closest('[data-school]');if(!b)return;schoolInput.value=b.dataset.school;majorInput.value='';setFilterAll();document.querySelectorAll('.school-tag').forEach(x=>x.classList.toggle('active',x===b));search({title:`${b.textContent.trim()} · 全部项目`,keepTag:true})});
  document.querySelector('#searchBtn').onclick=()=>{setFilterAll();search()};[schoolInput,majorInput].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter'){setFilterAll();search()}if(e.key==='Escape')closeSuggestions()}));document.addEventListener('click',e=>{if(!e.target.closest('.autocomplete'))closeSuggestions()});document.querySelector('#grid').onclick=e=>{const save=e.target.closest('[data-save]'),detail=e.target.closest('[data-id]');if(save){let id=+save.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('gradpath-saved',JSON.stringify([...saved]));render()}if(detail)openDetail(programs.find(p=>p.id===+detail.dataset.id))};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});document.querySelector('#dialog').onclick=e=>{if(e.target.id==='dialog')e.target.close()};render();
  </script>
